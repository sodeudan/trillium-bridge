services:

  trilium:
    image: triliumnext/trilium:v0.106.0
    container_name: trilium
    restart: unless-stopped

    ports:
      - "127.0.0.1:37841:8080"

    volumes:
      - trilium-data:/home/node/trilium-data


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: trilium-api
    restart: unless-stopped

    depends_on:
      trilium:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      TRILIUM_URL: http://trilium:8080
      TRILIUM_TOKEN: ${TRILIUM_TOKEN:?TRILIUM_TOKEN is not set}

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  trilium-data: